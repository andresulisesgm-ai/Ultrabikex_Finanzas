<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ULTRAX — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f0f2f7;--sf:#fff;
  --bd:#e2e8f0;--bd2:#cbd5e1;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-lg:0 12px 40px rgba(0,0,0,.13);
  --blue:#2563eb;--blue-d:#1e40af;
  --red:#dc2626;--red-l:#fee2e2;
  --tx:#0f172a;--tx2:#334155;--mu:#64748b;
}
body{
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(135deg,#000000 0%,#2d2d2d 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-container{
  background:var(--sf);
  border-radius:16px;
  box-shadow:var(--sh-lg);
  width:100%;
  max-width:420px;
  padding:40px;
}
.logo-section{
  text-align:center;
  margin-bottom:32px;
}
.logo-icon{
  width:64px;
  height:64px;
  background:var(--blue);
  border-radius:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
  font-size:24px;
  box-shadow:0 8px 24px rgba(37,99,235,.3);
  margin-bottom:16px;
}
.logo-section h1{
  font-size:28px;
  font-weight:800;
  letter-spacing:3px;
  color:var(--tx);
  margin-bottom:4px;
}
.logo-section p{
  font-size:12px;
  color:var(--mu);
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.form-group{
  margin-bottom:20px;
}
.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--tx2);
  margin-bottom:8px;
}
.form-group input{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--bd);
  border-radius:8px;
  font-size:14px;
  font-family:'DM Sans',sans-serif;
  color:var(--tx);
  transition:all .2s;
}
.form-group input:focus{
  outline:none;
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}
.btn-login{
  width:100%;
  padding:14px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:600;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  transition:all .2s;
  margin-top:8px;
}
.btn-login:hover{
  background:var(--blue-d);
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(37,99,235,.3);
}
.btn-login:active{
  transform:translateY(0);
}
.error-msg{
  background:var(--red-l);
  color:var(--red);
  padding:12px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
  margin-bottom:20px;
  display:none;
}
.error-msg.show{
  display:block;
}
.info-box{
  margin-top:24px;
  padding:16px;
  background:#f8fafc;
  border-radius:8px;
  border-left:3px solid var(--blue);
}
.info-box p{
  font-size:12px;
  color:var(--mu);
  line-height:1.6;
}
.info-box strong{
  color:var(--tx2);
  font-weight:600;
}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:380px;margin-top:-40px;">
  <div class="logo-section">
    <img src="{{ url_for('static', filename='img/ultrabikex_logo.png') }}" alt="UltraBikeX Financial Analytics" style="width:340px;">
  </div>
  <div class="login-container">

  <div id="errorMsg" class="error-msg"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login">Iniciar Sesión</button>
  </form>


</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.classList.remove('show');

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });

    const data = await response.json();

    if (response.ok) {
      window.location.href = '/';
    } else {
      errorMsg.textContent = data.error || 'Error al iniciar sesión';
      errorMsg.classList.add('show');
    }
  } catch (error) {
    errorMsg.textContent = 'Error de conexión. Intente nuevamente.';
    errorMsg.classList.add('show');
  }
});
</script>
</body>
</html>
